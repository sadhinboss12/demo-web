<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GableGrid — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1A56DB;--blue-light:#3B82F6;--blue-pale:#EFF6FF;
  --green:#059669;--green-pale:#ECFDF5;
  --dark:#0A1628;--mid:#334155;--soft:#64748B;
  --border:#E2E8F0;--off:#F8FAFC;--white:#fff;
  --red:#DC2626;--red-pale:#FEF2F2;
  --font-head:'Syne',sans-serif;--font-body:'Instrument Sans',sans-serif;
}
body{font-family:var(--font-body);background:var(--off);color:var(--dark);min-height:100vh}

/* LOGIN */
#loginScreen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;background:var(--dark);
  background-image:linear-gradient(rgba(26,86,219,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(26,86,219,0.06) 1px,transparent 1px);
  background-size:48px 48px;
}
.login-box{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-logo{font-family:var(--font-head);font-size:1.4rem;font-weight:800;color:var(--dark);margin-bottom:0.25rem;display:flex;align-items:center;gap:0.4rem}
.login-logo .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));display:inline-block}
.login-sub{font-size:0.85rem;color:var(--soft);margin-bottom:2rem}
.login-group{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:1rem}
.login-group label{font-size:0.78rem;font-weight:500;color:var(--mid)}
.login-group input{border:1px solid var(--border);border-radius:8px;padding:0.7rem 1rem;font-size:0.9rem;font-family:var(--font-body);outline:none;transition:border .2s;width:100%}
.login-group input:focus{border-color:var(--blue)}
.login-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:0.85rem;font-size:0.95rem;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:all .2s;margin-top:0.5rem}
.login-btn:hover{background:var(--blue-light)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{background:var(--red-pale);border:1px solid #FECACA;border-radius:8px;padding:0.6rem 0.9rem;font-size:0.82rem;color:var(--red);margin-top:0.75rem;display:none}

/* ADMIN */
#adminScreen{display:none}
.admin-header{background:var(--dark);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between}
.admin-brand{font-family:var(--font-head);font-size:1.1rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:0.4rem}
.admin-brand .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));display:inline-block}
.admin-brand span{font-size:0.72rem;font-weight:400;color:rgba(255,255,255,0.4);margin-left:0.4rem}
.admin-actions{display:flex;gap:0.75rem;align-items:center}
.btn-sm{padding:0.45rem 1rem;border-radius:7px;font-size:0.8rem;font-weight:500;cursor:pointer;font-family:var(--font-body);border:none;transition:all .2s}
.btn-refresh{background:rgba(255,255,255,0.1);color:#fff}
.btn-refresh:hover{background:rgba(255,255,255,0.2)}
.btn-logout{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.1)}
.btn-logout:hover{background:rgba(255,255,255,0.1);color:#fff}

.admin-body{padding:2rem;max-width:1200px;margin:0 auto}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem}
.kpi-num{font-family:var(--font-head);font-size:2rem;font-weight:800;letter-spacing:-0.03em}
.kpi-num.blue{color:var(--blue)}.kpi-num.green{color:var(--green)}.kpi-num.orange{color:#D97706}.kpi-num.red{color:var(--red)}
.kpi-label{font-size:0.78rem;color:var(--soft);margin-top:0.25rem}

/* TABLE */
.table-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.table-head{padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.table-head h2{font-family:var(--font-head);font-size:1.1rem;font-weight:700}
.table-search{border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.9rem;font-size:0.85rem;font-family:var(--font-body);outline:none;width:220px;transition:border .2s}
.table-search:focus{border-color:var(--blue)}

table{width:100%;border-collapse:collapse}
thead th{padding:0.85rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:600;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;background:var(--off);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
tbody tr:last-child{border:none}
tbody tr:hover{background:#F8FAFF}
tbody td{padding:1rem 1.25rem;font-size:0.875rem;vertical-align:top}
.td-name{font-weight:500;color:var(--dark)}
.td-email{color:var(--blue);font-size:0.82rem}
.td-service{display:inline-block;background:var(--blue-pale);color:var(--blue);font-size:0.7rem;font-weight:500;padding:3px 9px;border-radius:100px;white-space:nowrap}
.td-message{color:var(--soft);font-size:0.82rem;max-width:260px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-date{color:var(--soft);font-size:0.78rem;white-space:nowrap}
.td-new{display:inline-block;background:#DCFCE7;color:var(--green);font-size:0.65rem;font-weight:600;padding:2px 7px;border-radius:100px;letter-spacing:.04em}

.empty-state{padding:4rem;text-align:center;color:var(--soft)}
.empty-state .icon{font-size:2.5rem;margin-bottom:0.75rem}
.empty-state p{font-size:0.9rem}

.loading-state{padding:3rem;text-align:center;color:var(--soft);font-size:0.875rem}

/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,22,40,0.6);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:2rem;max-width:540px;width:100%;max-height:80vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
.modal-title{font-family:var(--font-head);font-size:1.1rem;font-weight:700}
.modal-close{background:var(--off);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.modal-field{margin-bottom:1.25rem}
.modal-field label{font-size:0.72rem;font-weight:600;color:var(--soft);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:0.35rem}
.modal-field p{font-size:0.9rem;color:var(--dark);line-height:1.65;background:var(--off);border-radius:8px;padding:0.75rem 1rem;border:1px solid var(--border)}

@media(max-width:768px){
  .stats-row{grid-template-columns:1fr 1fr}
  .admin-body{padding:1rem}
  table{font-size:0.8rem}
  thead th:nth-child(4),tbody td:nth-child(4){display:none}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo"><span class="dot"></span>GableGrid</div>
    <div class="login-sub">Admin Panel — Sign in to continue</div>
    <div class="login-group"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@gablegrid.com"></div>
    <div class="login-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In →</button>
  </div>
</div>

<!-- ADMIN -->
<div id="adminScreen">
  <div class="admin-header">
    <div class="admin-brand"><span class="dot"></span>GableGrid <span>Admin Panel</span></div>
    <div class="admin-actions">
      <button class="btn-sm btn-refresh" onclick="loadSubmissions()">↻ Refresh</button>
      <button class="btn-sm btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="admin-body">
    <div class="stats-row">
      <div class="kpi"><div class="kpi-num blue" id="statTotal">—</div><div class="kpi-label">Total Submissions</div></div>
      <div class="kpi"><div class="kpi-num green" id="statToday">—</div><div class="kpi-label">Received Today</div></div>
      <div class="kpi"><div class="kpi-num orange" id="statWeek">—</div><div class="kpi-label">This Week</div></div>
      <div class="kpi"><div class="kpi-num" id="statTop" style="font-size:1rem;padding-top:0.3rem">—</div><div class="kpi-label">Top Service</div></div>
    </div>

    <div class="table-card">
      <div class="table-head">
        <h2>Contact Submissions</h2>
        <input class="table-search" id="searchInput" type="text" placeholder="Search name, email..." oninput="filterTable()">
      </div>
      <div id="tableWrap">
        <div class="loading-state">Loading submissions...</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title">Submission Detail</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = 'https://qzrdnreiwhgxgchejbbr.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_-C2arVIJRtnp28z_gnJvGg_k_3WCMP5'
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  let allData = []

  window.doLogin = async function(){
    const email = document.getElementById('loginEmail').value.trim()
    const pass  = document.getElementById('loginPassword').value
    const btn   = document.getElementById('loginBtn')
    const err   = document.getElementById('loginError')

    if(!email || !pass){ err.textContent='Please enter email and password.'; err.style.display='block'; return }

    btn.disabled = true; btn.textContent = 'Signing in...'
    err.style.display = 'none'

    const { error } = await supabase.auth.signInWithPassword({ email, password: pass })

    if(error){
      err.textContent = 'Invalid email or password. Please try again.'
      err.style.display = 'block'
      btn.disabled = false; btn.textContent = 'Sign In →'
    } else {
      document.getElementById('loginScreen').style.display = 'none'
      document.getElementById('adminScreen').style.display = 'block'
      loadSubmissions()
    }
  }

  window.doLogout = async function(){
    await supabase.auth.signOut()
    document.getElementById('adminScreen').style.display = 'none'
    document.getElementById('loginScreen').style.display = 'flex'
  }

  window.loadSubmissions = async function(){
    document.getElementById('tableWrap').innerHTML = '<div class="loading-state">Loading submissions...</div>'

    const { data, error } = await supabase
      .from('contacts')
      .select('*')
      .order('created_at', { ascending: false })

    if(error){
      document.getElementById('tableWrap').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>Error loading data: '+error.message+'</p></div>'
      return
    }

    allData = data || []
    updateStats(allData)
    renderTable(allData)
  }

  function updateStats(data){
    const now = new Date()
    const today = data.filter(d => new Date(d.created_at).toDateString() === now.toDateString()).length
    const week  = data.filter(d => (now - new Date(d.created_at)) < 7*24*60*60*1000).length
    const svcCount = {}
    data.forEach(d=>{ if(d.service){ svcCount[d.service]=(svcCount[d.service]||0)+1 }})
    const topSvc = Object.entries(svcCount).sort((a,b)=>b[1]-a[1])[0]

    document.getElementById('statTotal').textContent = data.length
    document.getElementById('statToday').textContent = today
    document.getElementById('statWeek').textContent  = week
    document.getElementById('statTop').textContent   = topSvc ? topSvc[0].split(' ')[0] : '—'
  }

  function renderTable(data){
    if(!data.length){
      document.getElementById('tableWrap').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No submissions yet. Share your website to get started!</p></div>'
      return
    }

    const rows = data.map((d,i) => {
      const date = new Date(d.created_at)
      const isNew = (Date.now() - date) < 24*60*60*1000
      const dateStr = date.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})
      const timeStr = date.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})
      return `<tr style="cursor:pointer" onclick="openModal(${i})">
        <td><div class="td-name">${esc(d.name)} ${isNew?'<span class="td-new">NEW</span>':''}</div><div class="td-email">${esc(d.email)}</div></td>
        <td><span class="td-service">${esc(d.service||'Not specified')}</span></td>
        <td><div class="td-message">${esc(d.message||'')}</div></td>
        <td class="td-date">${dateStr}<br><span style="color:#94A3B8">${timeStr}</span></td>
      </tr>`
    }).join('')

    document.getElementById('tableWrap').innerHTML = `
      <table>
        <thead><tr><th>Contact</th><th>Service</th><th>Message</th><th>Date</th></tr></thead>
        <tbody id="tableBody">${rows}</tbody>
      </table>`
  }

  window.filterTable = function(){
    const q = document.getElementById('searchInput').value.toLowerCase()
    const filtered = allData.filter(d =>
      (d.name||'').toLowerCase().includes(q) ||
      (d.email||'').toLowerCase().includes(q) ||
      (d.service||'').toLowerCase().includes(q) ||
      (d.message||'').toLowerCase().includes(q)
    )
    renderTable(filtered)
  }

  window.openModal = function(i){
    const d = allData[i]
    const date = new Date(d.created_at).toLocaleString('en-GB',{dateStyle:'full',timeStyle:'short'})
    document.getElementById('modalBody').innerHTML = `
      <div class="modal-field"><label>Name</label><p>${esc(d.name)}</p></div>
      <div class="modal-field"><label>Email</label><p><a href="mailto:${esc(d.email)}" style="color:var(--blue)">${esc(d.email)}</a></p></div>
      <div class="modal-field"><label>Service</label><p>${esc(d.service||'Not specified')}</p></div>
      <div class="modal-field"><label>Message</label><p style="white-space:pre-wrap">${esc(d.message||'')}</p></div>
      <div class="modal-field"><label>Submitted</label><p>${date}</p></div>`
    document.getElementById('modalOverlay').classList.add('open')
  }

  window.closeModal = function(e){
    if(!e || e.target===document.getElementById('modalOverlay'))
      document.getElementById('modalOverlay').classList.remove('open')
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

  // check if already logged in
  supabase.auth.getSession().then(({data:{session}})=>{
    if(session){
      document.getElementById('loginScreen').style.display='none'
      document.getElementById('adminScreen').style.display='block'
      loadSubmissions()
    }
  })
</script>
</body>
</html>
